<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Blinkit MVP - 10 Minute Grocery Delivery</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Outfit:wght@600;800;900&display=swap" rel="stylesheet" />

  <!-- Core Design System CSS -->
  <link rel="stylesheet" href="./src/css/index.css" />
</head>
<body>

  <!-- Multi-Persona Switcher & Application Header -->
  <div id="header-container"></div>

  <!-- Consumer View: Category Pills Navigation -->
  <div id="category-nav-container"></div>

  <!-- Consumer View: Product Catalog Grid -->
  <div id="catalog-container"></div>

  <!-- Consumer View: Slide-Over Cart Drawer -->
  <div id="cart-drawer-container"></div>

  <!-- Consumer View: Checkout Modal -->
  <div id="checkout-modal-container"></div>

  <!-- Consumer View: Order Tracking Hub (Shown after order placement) -->
  <div id="order-tracker-container"></div>

  <!-- Dark Store View: Picker Portal -->
  <div id="picker-view-container"></div>

  <!-- Rider View: Delivery Partner App -->
  <div id="rider-view-container"></div>

  <!-- Admin View: Operations & Merchant Dashboard -->
  <div id="admin-view-container"></div>

  <!-- Main Application Entry Module -->
  <script type="module" src="./src/js/app.js"></script>
</body>
</html>
